name: Publish to Maven Central

on:
  push:
    tags:
      - "*.*.*"

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Setup JDK 11
        uses: actions/setup-java@215b7e5f829ab9cac114c149667e57dc1b70b4bc # v2
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@56b90f209b02bf6d1deae490e9ef18b21a389cd4 # v1
      - name: Decode GPG secret key ring
        run: |
          printf "${{ secrets.SIGNING_KEYRING_FILE }}" | base64 --decode > "/home/runner/secring.gpg"
      - name: Publish
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2
        with:
          arguments: |
            assemble publish --stacktrace
            -Psigning.keyId=${{ secrets.SIGNING_KEY_ID }}
            -Psigning.password=${{ secrets.SIGNING_KEY_PASSWORD }}
            -Psigning.secretKeyRingFile=/home/runner/secring.gpg
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release on GitHub
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          name: "Release ${{ github.ref_name }}"
          files: "**/build/libs/kode-${{ github.ref_name }}*"
          fail_on_unmatched_files: true
